<!DOCTYPE html>
<html lang="ko" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇲🇽 멕시코시티 여행 계획 3/17~3/21</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <!-- Firebase compat SDK (no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { interpolate-size: allow-keywords; }
    html.theme-dark {
      --bg:#0A0A0A; --surface:#141414; --surface-hover:#1C1C1C;
      --border:rgba(255,255,255,0.06); --border-strong:rgba(255,255,255,0.12);
      --text:#EDEDED; --text-secondary:#888;
      --accent:#f97316; --accent-secondary:#8b5cf6;
      --positive:#10b981; --negative:#f43f5e; --warning:#f59e0b;
    }
    html.theme-light {
      --bg:#FAFAF9; --surface:#FFFFFF; --surface-hover:#F0EDE8;
      --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.15);
      --text:#0f172a; --text-secondary:#64748b;
      --accent:#ea580c; --accent-secondary:#7c3aed;
      --positive:#059669; --negative:#e11d48; --warning:#d97706;
    }
    body { font-family:'Noto Sans KR','Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; -webkit-font-smoothing:antialiased; transition:background 0.3s,color 0.3s; min-height:100vh; }
    h1 { font-weight:700; font-size:2.5rem; letter-spacing:-0.03em; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .animate { animation:fadeInUp 0.5s ease-out both; }
    .reveal { opacity:0; transform:translateY(20px); transition:opacity 0.5s ease,transform 0.5s ease; }
    .reveal.visible { opacity:1; transform:translateY(0); }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important;transition:none!important} .reveal{opacity:1;transform:none} }
    /* HEADER */
    .app-header { position:sticky; top:0; z-index:200; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 20px; display:flex; align-items:center; gap:14px; backdrop-filter:blur(16px); }
    .app-logo { display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .app-logo-flag { font-size:1.6rem; line-height:1; }
    .app-logo-text h1 { font-size:1.05rem; font-weight:700; letter-spacing:-0.02em; }
    .app-logo-text .dates { font-size:0.72rem; color:var(--text-secondary); font-weight:400; }
    .app-header .view-tabs { position:absolute; left:50%; transform:translateX(-50%); }
    .view-tabs { display:flex; gap:3px; background:var(--surface); padding:3px; border-radius:10px; border:1px solid var(--border); }
    .view-tab { padding:5px 13px; border-radius:7px; border:none; background:transparent; color:var(--text-secondary); font-family:inherit; font-size:0.82rem; font-weight:500; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .view-tab.active { background:var(--accent); color:white; }
    .view-tab:hover:not(.active) { background:var(--surface-hover); color:var(--text); }
    .save-indicator { font-size:0.7rem; color:var(--text-secondary); opacity:0; transition:opacity 0.3s; white-space:nowrap; margin-left:auto; }
    .save-indicator.saving { opacity:1; color:var(--warning); }
    .save-indicator.saved { opacity:1; color:var(--positive); }
    .save-indicator.error { opacity:1; color:var(--negative); }
    /* Loading overlay */
    .loading-screen { position:fixed; inset:0; background:var(--bg); z-index:9000; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
    .loading-screen .spinner { width:32px; height:32px; border:3px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .loading-screen p { font-size:0.85rem; color:var(--text-secondary); }
    /* VIEWS */
    .view { display:none; }
    .view.active { display:block; }
    #view-map.active { display:flex; }
    /* CALENDAR */
    .cal-scroll-outer { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .cal-wrap { min-width:1100px; }
    .cal-header-row { display:grid; grid-template-columns:58px repeat(5,1fr); border-bottom:1px solid var(--border); position:sticky; top:57px; z-index:100; background:var(--bg); }
    .cal-header-time { padding:10px 0; }
    .cal-day-header { padding:10px 12px; border-left:1px solid var(--border); }
    .cal-day-date { font-size:0.95rem; font-weight:700; display:flex; align-items:center; gap:6px; }
    .cal-day-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .cal-day-theme { font-size:0.7rem; color:var(--text-secondary); margin-top:2px; }
    .cal-day-add { display:inline-flex; align-items:center; gap:3px; font-size:0.68rem; color:var(--text-secondary); background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:2px 6px; cursor:pointer; margin-top:5px; font-family:inherit; transition:all 0.2s; }
    .cal-day-add:hover { border-color:var(--accent); color:var(--accent); }
    .cal-body-row { display:grid; grid-template-columns:58px repeat(5,1fr); padding:8px 0; }
    .cal-time-col { padding-right:6px; }
    .cal-time-slot { height:64px; display:flex; align-items:flex-start; padding-top:3px; font-size:0.68rem; color:var(--text-secondary); text-align:right; justify-content:flex-end; padding-right:8px; white-space:nowrap; }
    .cal-day-col { position:relative; border-left:1px solid var(--border); height:calc(16 * 64px); cursor:crosshair; }
    .cal-day-col:hover::after { content:'+ 위시리스트에서 추가'; position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:0.6rem; color:var(--border-strong); pointer-events:none; }
    .hour-line { position:absolute; left:0; right:0; border-top:1px dashed var(--border); pointer-events:none; }
    .cal-event { position:absolute; border-radius:6px; padding:5px 7px; cursor:pointer; overflow:hidden; transition:filter 0.2s,transform 0.15s; border-left:3px solid; box-shadow:0 1px 4px rgba(0,0,0,0.15); }
    .cal-event:hover { filter:brightness(1.1); transform:scaleX(1.02); z-index:10!important; }
    .cal-event.optional { opacity:0.6; border-style:dashed; }
    .cal-event-time { font-size:0.62rem; font-weight:600; opacity:0.85; }
    .cal-event-title { font-size:0.77rem; font-weight:700; line-height:1.25; margin-top:1px; }
    .cal-event-sub { font-size:0.67rem; opacity:0.8; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cal-badge { display:inline-block; font-size:0.58rem; padding:1px 4px; border-radius:3px; margin-top:3px; font-weight:500; background:rgba(255,255,255,0.18); }
    /* WISHLIST */
    .wishlist-view { max-width:860px; margin:0 auto; padding:28px 20px 120px; }
    .wl-toolbar { display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
    .wl-toolbar-top { display:flex; align-items:center; }
    .wl-filter-rows { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    .wl-filter-group { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
    .wl-title { font-size:1.3rem; font-weight:700; }
    .wl-count { font-size:0.8rem; color:var(--text-secondary); margin-left:8px; }
    .wl-filter { padding:4px 11px; border-radius:14px; font-size:0.76rem; font-weight:500; border:1px solid var(--border); background:transparent; cursor:pointer; font-family:inherit; color:var(--text-secondary); transition:all 0.2s; }
    .wl-filter.active { background:var(--accent); color:white; border-color:transparent; }
    .wl-filter:hover:not(.active) { border-color:var(--accent); color:var(--accent); }
    .wl-filter.status-btn.active { background:#6366f1; border-color:transparent; }
    .wl-filter.status-btn:hover:not(.active) { border-color:#6366f1; color:#6366f1; }
    .wl-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
    .wl-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; cursor:pointer; transition:box-shadow 0.2s,border-color 0.2s; display:flex; flex-direction:column; gap:6px; }
    .wl-card:hover { box-shadow:0 4px 20px rgba(0,0,0,0.12); border-color:var(--border-strong); }
    .wl-card.visited { opacity:0.65; }
    .wl-card-top { display:flex; align-items:flex-start; gap:10px; }
    .wl-card-icon { width:36px; height:36px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .wl-card-info { flex:1; min-width:0; }
    .wl-card-name { font-size:0.95rem; font-weight:700; line-height:1.3; }
    .wl-card-sub { font-size:0.78rem; color:var(--text-secondary); margin-top:2px; }
    .wl-card-badges { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
    .wl-badge { display:inline-flex; align-items:center; gap:3px; font-size:0.67rem; padding:2px 7px; border-radius:10px; font-weight:500; }
    .wl-card-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
    .wl-maps-link { display:inline-flex; align-items:center; gap:4px; font-size:0.73rem; color:var(--accent); text-decoration:none; padding:3px 8px; border-radius:6px; border:1px solid var(--accent); transition:all 0.2s; white-space:nowrap; }
    .wl-maps-link:hover { background:var(--accent); color:white; }
    .wl-visited-toggle { display:inline-flex; align-items:center; gap:4px; font-size:0.72rem; background:none; border:1px solid var(--border); border-radius:6px; padding:3px 8px; cursor:pointer; color:var(--text-secondary); font-family:inherit; transition:all 0.2s; }
    .wl-visited-toggle:hover { border-color:var(--accent); color:var(--accent); }
    .wl-card.visited .wl-visited-toggle.adjust { border-color:var(--positive); color:var(--positive); background:rgba(16,185,129,0.1); }
    .wl-time-remove { color:var(--warning)!important; border-color:rgba(245,158,11,0.4)!important; }
    .wl-time-remove:hover { background:rgba(245,158,11,0.1)!important; border-color:var(--warning)!important; }
    .wl-del-btn { color:#ef4444!important; border-color:#ef444460!important; }
    .wl-del-btn:hover { background:#ef444415!important; border-color:#ef4444!important; }
    .wl-empty { text-align:center; padding:60px 20px; color:var(--text-secondary); grid-column:1/-1; }
    .wl-empty-icon { font-size:3rem; margin-bottom:12px; }
    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; visibility:hidden; transition:all 0.25s; }
    .modal-overlay.open { opacity:1; visibility:visible; }
    .modal { background:var(--surface); border:1px solid var(--border-strong); border-radius:16px; padding:26px; width:100%; max-width:460px; transform:translateY(18px); transition:transform 0.3s; max-height:90vh; overflow-y:auto; }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .modal-head h2 { font-size:1.1rem; font-weight:700; }
    .modal-close { width:30px; height:30px; border-radius:7px; background:var(--surface-hover); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:16px; transition:background 0.2s; }
    .modal-close:hover { background:var(--border-strong); }
    .form-group { margin-bottom:14px; }
    .form-label { display:block; font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-bottom:5px; }
    .form-input { width:100%; padding:9px 11px; border-radius:7px; border:1px solid var(--border-strong); background:var(--bg); color:var(--text); font-family:inherit; font-size:0.88rem; transition:border-color 0.2s; }
    .form-input:focus { outline:none; border-color:var(--accent); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .form-checkbox-row { display:flex; align-items:center; gap:8px; }
    .form-checkbox-row input { width:15px; height:15px; cursor:pointer; accent-color:var(--accent); }
    .form-checkbox-row label { font-size:0.86rem; cursor:pointer; }
    .modal-actions { display:flex; gap:7px; justify-content:flex-end; margin-top:22px; }
    .btn { padding:8px 16px; border-radius:7px; font-family:inherit; font-size:0.85rem; font-weight:500; cursor:pointer; border:none; transition:opacity 0.2s; }
    .btn:hover { opacity:0.82; }
    .btn-primary { background:var(--accent); color:white; }
    .btn-secondary { background:var(--surface-hover); color:var(--text); }
    .btn-danger { background:var(--negative); color:white; margin-right:auto; }
    /* SCHEDULE MODAL */
    .sched-modal-box { background:var(--surface); border-radius:16px; width:520px; max-width:96vw; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,0.45); }
    .sched-header { display:flex; align-items:flex-start; justify-content:space-between; padding:18px 20px 12px; border-bottom:1px solid var(--border); gap:12px; }
    .sched-title { font-size:1rem; font-weight:700; }
    .sched-item-name { font-size:0.82rem; color:var(--text-secondary); margin-top:2px; }
    .sched-days { display:flex; gap:6px; padding:12px 20px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
    .sched-day-btn { padding:5px 10px; border-radius:10px; font-size:0.72rem; font-weight:600; border:1px solid var(--border); background:transparent; cursor:pointer; font-family:inherit; color:var(--text-secondary); transition:all 0.2s; text-align:center; line-height:1.4; }
    .sched-day-btn:hover:not(.active) { border-color:var(--accent); color:var(--accent); }
    .sched-time-row { display:flex; gap:16px; padding:12px 20px; align-items:center; border-bottom:1px solid var(--border); }
    .sched-time-group { display:flex; align-items:center; gap:7px; }
    .sched-time-group label { font-size:0.75rem; color:var(--text-secondary); font-weight:600; white-space:nowrap; }
    .sched-time-inputs { display:flex; align-items:center; gap:4px; }
    .sched-time-inputs input[type=number],.sched-time-inputs select,.sched-time-group select { background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--text); font-family:inherit; font-size:0.82rem; padding:4px 7px; }
    .sched-time-inputs input[type=number] { width:52px; }
    .sched-cal { overflow-y:auto; flex:1; }
    .sched-cal-inner { position:relative; margin:0 20px; }
    .sched-cal-hr { position:absolute; left:0; right:0; height:44px; border-top:1px solid var(--border); display:flex; align-items:flex-start; }
    .sched-cal-hr-label { font-size:0.62rem; color:var(--text-secondary); padding:2px 0 0 0; min-width:36px; }
    .sched-ev-block { position:absolute; left:40px; right:4px; border-radius:5px; padding:3px 6px; overflow:hidden; pointer-events:none; }
    .sched-new-block { position:absolute; left:40px; right:4px; border-radius:7px; background:var(--accent); color:white; padding:5px 8px; cursor:grab; user-select:none; box-shadow:0 3px 14px rgba(0,0,0,0.25); border:2px solid rgba(255,255,255,0.3); overflow:hidden; }
    .sched-new-block:active { cursor:grabbing; }
    .sched-resize-handle { position:absolute; bottom:0; right:0; padding:1px 5px; font-size:0.7rem; cursor:ns-resize; opacity:0.6; line-height:1; }
    .sched-footer { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-top:1px solid var(--border); gap:10px; }
    .sched-footer-right { display:flex; gap:8px; }
    .sched-del-btn { background:none; border:1px solid var(--border); border-radius:8px; padding:7px 13px; font-size:0.8rem; cursor:pointer; font-family:inherit; color:#ef4444; transition:all 0.2s; }
    .sched-del-btn:hover { background:#ef444415; border-color:#ef4444; }
    .sched-cancel-btn { background:none; border:1px solid var(--border); border-radius:8px; padding:7px 14px; font-size:0.8rem; cursor:pointer; font-family:inherit; color:var(--text); transition:all 0.2s; }
    .sched-cancel-btn:hover { border-color:var(--accent); }
    .sched-save-btn { background:var(--accent); color:white; border:none; border-radius:8px; padding:7px 18px; font-size:0.8rem; font-weight:700; cursor:pointer; font-family:inherit; transition:all 0.2s; }
    .sched-save-btn:hover { filter:brightness(1.1); }
    /* CAL PICK */
    .cal-pick-list { display:flex; flex-direction:column; gap:5px; max-height:360px; overflow-y:auto; margin-top:10px; }
    .cal-pick-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:transparent; cursor:pointer; font-family:inherit; text-align:left; transition:all 0.15s; width:100%; color:var(--text); }
    .cal-pick-item:hover { background:var(--surface-hover); border-color:var(--accent); }
    .cal-pick-icon { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
    .cal-pick-info { flex:1; min-width:0; }
    .cal-pick-name { font-size:0.9rem; font-weight:600; }
    .cal-pick-sub { font-size:0.75rem; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
    .cal-pick-cat { font-size:0.68rem; padding:2px 7px; border-radius:8px; flex-shrink:0; }
    /* VIZ MENU */
    .viz-menu { position:fixed; top:12px; right:14px; z-index:9999; }
    .viz-menu-toggle { width:40px; height:40px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(12px); transition:all 0.2s; }
    .viz-menu-toggle:hover { background:var(--surface-hover); }
    .viz-menu-dropdown { position:absolute; top:48px; right:0; min-width:190px; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:6px; opacity:0; visibility:hidden; transform:translateY(-6px); transition:all 0.2s; }
    .viz-menu-dropdown.open { opacity:1; visibility:visible; transform:translateY(0); }
    .viz-menu-dropdown button { width:100%; padding:9px 12px; border:none; border-radius:7px; background:transparent; color:var(--text); font-size:13px; font-family:inherit; cursor:pointer; text-align:left; display:flex; align-items:center; gap:9px; transition:background 0.15s; }
    .viz-menu-dropdown button:hover { background:var(--surface-hover); }
    /* MAP */
    .map-view { height:calc(100vh - 57px); overflow:hidden; }
    .map-sidebar { width:300px; min-width:260px; overflow-y:auto; border-right:1px solid var(--border); padding:14px; background:var(--bg); flex-shrink:0; }
    .map-main { flex:1; position:relative; min-height:0; min-width:0; }
    #leaflet-map { position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; }
    .leaflet-popup-content-wrapper { border-radius:10px!important; }
    .leaflet-popup-content { font-family:'Noto Sans KR',sans-serif!important; margin:10px 14px!important; }
    html.theme-dark .leaflet-popup-content-wrapper { background:#1e1e1e!important; color:#ededed!important; border:1px solid rgba(255,255,255,0.1)!important; }
    html.theme-dark .leaflet-popup-tip { background:#1e1e1e!important; }
    .map-filter-row { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px; }
    .map-filter-btn { padding:3px 9px; border-radius:14px; font-size:0.73rem; font-weight:500; border:1px solid var(--border); background:transparent; cursor:pointer; font-family:inherit; color:var(--text-secondary); transition:all 0.2s; }
    .map-filter-btn.active { color:white; border-color:transparent; }
    .map-group-title { font-size:0.78rem; font-weight:700; padding:5px 8px; border-radius:5px; margin-bottom:6px; display:flex; align-items:center; gap:5px; }
    .map-event-row { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:6px; cursor:pointer; transition:background 0.15s; margin-bottom:2px; }
    .map-event-row:hover { background:var(--surface-hover); }
    .map-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .map-event-time { font-size:0.68rem; color:var(--text-secondary); white-space:nowrap; }
    .map-event-name { font-size:0.8rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .map-group { margin-bottom:18px; }
    /* FAB */
    .fab { position:fixed; bottom:28px; right:28px; z-index:500; width:56px; height:56px; border-radius:50%; background:var(--accent); color:white; border:none; font-size:26px; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; transition:transform 0.2s,box-shadow 0.2s; }
    .fab:hover { transform:scale(1.08); box-shadow:0 6px 24px rgba(0,0,0,0.35); }
    .fab:active { transform:scale(0.95); }

      try { var s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; }
    }

      try { localStorage.setItem(LS_KEY, JSON.stringify({ days: DAYS, wishlist: WISHLIST })); } catch(e) {}
    }

    async function loadData() {
      try {
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Firestore timeout')), 5000)
        );
        const snap = await Promise.race([DOC_REF.get(), timeout]);
        const d = snap.exists ? snap.data() : null;
        if (d && d.days && d.days.length > 0) {
          DAYS = d.days;
          WISHLIST = d.wishlist || [];
          lsSave();
          return;
        }
      } catch(e) {
        console.warn('Firestore unavailable:', e.message);
      }
      // Try localStorage next
      var cached = lsLoad();
      if (cached && cached.days && cached.days.length > 0) {
        DAYS = cached.days;
        WISHLIST = cached.wishlist || [];
        return;
      }
      // Fall back to seed data
      DAYS = JSON.parse(JSON.stringify(SEED_DAYS));
      WISHLIST = JSON.parse(JSON.stringify(SEED_WISHLIST));
      lsSave();
      try { DOC_REF.set({ days: DAYS, wishlist: WISHLIST }); } catch(e) {}
    }

    var saveTimer = null;
    function scheduleSave() {
      var i = document.getElementById('saveIndicator');
      if (i) { i.textContent = '저장 중…'; i.className = 'save-indicator saving'; }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(doSave, 1000);
    }
    async function doSave() {
      var i = document.getElementById('saveIndicator');
      lsSave();
      try {
        await DOC_REF.set({ days: DAYS, wishlist: WISHLIST });
        if (i) { i.textContent = '저장됨 ✓'; i.className = 'save-indicator saved'; setTimeout(function(){ i.className='save-indicator'; }, 2000); }
      } catch(e) {
        console.error('Firestore save failed:', e);
        if (i) { i.textContent = '저장됨 (로컬) ✓'; i.className = 'save-indicator saved'; setTimeout(function(){ i.className='save-indicator'; }, 2000); }
      }
    }

    // ==================== UTILS ====================
    function toMin(t){if(!t)return 0;var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
    function minToStr(m){var h=Math.floor(m/60),mm=m%60;return(h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
    function fmtTime(t){if(!t)return'';var p=t.split(':'),h=parseInt(p[0]),m=p[1];return(h%12||12)+':'+m+(h>=12?'PM':'AM');}
    function evTop(t){return((toMin(t)-START_HR*60)/60)*HOUR_PX;}
    function evH(s,e){if(!e)return HOUR_PX;return(Math.max(toMin(e)-toMin(s),30)/60)*HOUR_PX;}
    function genId(){return'e'+Date.now()+Math.random().toString(36).slice(2,6);}
    function getDay(id){return DAYS.find(function(d){return d.id===id;});}
    function getEv(did,eid){var d=getDay(did);return d?d.events.find(function(e){return e.id===eid;}):null;}
    function sortEvs(evs){return evs.slice().sort(function(a,b){return toMin(a.time)-toMin(b.time);});}

    // ==================== OVERLAP LAYOUT ====================
    function computeEventLayout(events){
      var sorted=sortEvs(events),colEnds=[],cols={};
      sorted.forEach(function(ev){
        var s=toMin(ev.time),e=ev.endTime?Math.max(toMin(ev.endTime),s+15):s+60,c=0;
        while(c<colEnds.length&&colEnds[c]>s)c++;
        if(c===colEnds.length)colEnds.push(0);
        colEnds[c]=e;cols[ev.id]=c;
      });
      var result={};
      sorted.forEach(function(ev){
        var s=toMin(ev.time),e=ev.endTime?Math.max(toMin(ev.endTime),s+15):s+60,maxCol=cols[ev.id];
        sorted.forEach(function(o){var os=toMin(o.time),oe=o.endTime?Math.max(toMin(o.endTime),os+15):os+60;if(os<e&&oe>s)maxCol=Math.max(maxCol,cols[o.id]);});
        result[ev.id]={col:cols[ev.id],total:maxCol+1};
      });
      return result;
    }

      document.getElementById('view-'+v).classList.add('active');
      var tabs=document.querySelectorAll('.view-tab'),idx=['calendar','map','wishlist'].indexOf(v);
      if(idx>=0){tabs[idx].classList.add('active');tabs[idx].setAttribute('aria-selected','true');}
      if(v==='calendar')renderCal();
      if(v==='wishlist')renderWishlist();
      if(v==='map'){renderMapUI();setTimeout(initMap,200);}

    function renderCalHeader(){
      var el=document.getElementById('calHeaderRow'),h='<div class="cal-header-time"></div>';
      DAYS.forEach(function(day){
        h+='<div class="cal-day-header" style="border-left-color:'+day.color+'40"><div class="cal-day-date"><span class="cal-day-dot" style="background:'+day.color+'"></span><span>'+day.date+'</span></div><div class="cal-day-theme">'+day.theme+'</div><button class="cal-day-add" onclick="event.stopPropagation();openCalPickModal(\''+day.id+'\',null)">+ 추가</button></div>';
      });

    function renderCalBody(){
      var el=document.getElementById('calBodyRow'),h='<div class="cal-time-col">';
      for(var hr=START_HR;hr<END_HR;hr++){var lbl=hr===12?'12PM':hr>12?(hr-12)+'PM':hr+'AM';h+='<div class="cal-time-slot">'+lbl+'</div>';}
      h+='</div>';
      DAYS.forEach(function(day){
        var sorted=sortEvs(day.events),layout=computeEventLayout(day.events);
        h+='<div class="cal-day-col" style="border-left-color:'+day.color+'25" onclick="onCalColClick(event,\''+day.id+'\')">';
        for(var i=0;i<TOTAL_HRS;i++)h+='<div class="hour-line" style="top:'+(i*HOUR_PX)+'px"></div>';
        sorted.forEach(function(ev){
          var top=evTop(ev.time),height=Math.max(evH(ev.time,ev.endTime),46);
          var cat=CAT[ev.category]||CAT.other,cls='cal-event'+(ev.optional?' optional':'');
          var lyt=layout[ev.id]||{col:0,total:1};
          var ps=lyt.total===1?'left:6px;right:6px;':'left:calc('+(lyt.col*100/lyt.total)+'% + 2px);width:calc('+(100/lyt.total)+'% - 4px);right:auto;';
          h+='<div class="'+cls+'" style="top:'+top+'px;height:'+height+'px;background:'+cat.bg+';border-left-color:'+cat.color+';'+ps+'z-index:'+(lyt.col+2)+'" onclick="event.stopPropagation();openEdit(\''+day.id+'\',\''+ev.id+'\')" title="'+ev.title+'">';
          h+='<div class="cal-event-time">'+fmtTime(ev.time)+(ev.endTime?'–'+fmtTime(ev.endTime):'')+'</div>';
          h+='<div class="cal-event-title" style="color:'+cat.color+'">'+ev.title+'</div>';
          if(height>58&&ev.subtitle)h+='<div class="cal-event-sub">'+ev.subtitle+'</div>';
          if(ev.optional)h+='<span class="cal-badge">optional</span>';
          if(ev.notes&&height>80)h+='<span class="cal-badge" style="background:rgba(245,158,11,0.25);color:#f59e0b;">'+ev.notes+'</span>';
          h+='</div>';
        });
        h+='</div>';
      });
      el.innerHTML=h;
    }
    function onCalColClick(e,dayId){
      if(e.target.closest('.cal-event')||e.target.closest('.cal-day-add'))return;
      var rect=e.currentTarget.getBoundingClientRect();
      var tm=Math.max(START_HR*60,Math.min((END_HR-1)*60,Math.round(((e.clientY-rect.top)/HOUR_PX+START_HR)*60/15)*15));
      openCalPickModal(dayId,minToStr(tm));
    }

        if(w.mapsUrl)h+='<a class="wl-maps-link" href="'+w.mapsUrl+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> 구글맵</a>';
        else h+='<span></span>';
        if(w.visited&&w.calEventId)h+='<div style="display:flex;gap:5px"><button class="wl-visited-toggle adjust" onclick="event.stopPropagation();openSchedModal(\''+w.id+'\')">✏️ 시간 조정</button><button class="wl-visited-toggle wl-time-remove" onclick="event.stopPropagation();removeTimeFromWish(\''+w.id+'\')">⏰ 시간 제거</button></div>';
        else h+='<button class="wl-visited-toggle" onclick="event.stopPropagation();openSchedModal(\''+w.id+'\')">＋ 일정 추가</button>';
        h+='</div></div>';
      });
      h+='</div>';c.innerHTML=h;
    }
    function wlCatBtn(v,l,a){return'<button class="wl-filter'+(a===v?' active':'')+'" onclick="setWlCatFilter(\''+v+'\')">'+l+'</button>';}
    function wlSBtn(v,l,a){return'<button class="wl-filter status-btn'+(a===v?' active':'')+'" onclick="setWlStatusFilter(\''+v+'\')">'+l+'</button>';}
    function setWlCatFilter(f){wishCatFilter=f;renderWishlist();}
    function setWlStatusFilter(f){wishStatusFilter=f;renderWishlist();}
    function removeTimeFromWish(wishId){
      var w=WISHLIST.find(function(x){return x.id===wishId;});if(!w||!w.calDayId||!w.calEventId)return;
      var day=DAYS.find(function(d){return d.id===w.calDayId;});
      if(day)day.events=day.events.filter(function(e){return e.id!==w.calEventId;});
      w.calDayId=null;w.calEventId=null;w.visited=false;w.dayLabel='';rerender();
    }
    function parseGmapsUrl(url){
      url=(url||'').trim();if(!url)return;
      if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(url)){
        var nf=document.getElementById('wishName');if(nf)nf.placeholder='불러오는 중…';
        fetch('/api/expand-url?url='+encodeURIComponent(url))
          .then(function(r){return r.json();})
          .then(function(d){var nf2=document.getElementById('wishName');if(nf2)nf2.placeholder='예: Contramar';applyGmapsInfo(d.url||url);})
          .catch(function(){var nf2=document.getElementById('wishName');if(nf2)nf2.placeholder='예: Contramar';});
        return;
      }
      applyGmapsInfo(url);
    }
    function applyGmapsInfo(url){
      var name='';
      var nm=url.match(/maps\/place\/([^/@?&]+)/);
      if(nm)name=decodeURIComponent(nm[1]).replace(/\+/g,' ').replace(/_/g,' ').replace(/[,+]\d.*$/,'').trim();
      if(!name){var qm=url.match(/[?&]q=([^&@,]+)/);if(qm)name=decodeURIComponent(qm[1]).replace(/\+/g,' ').trim();}
      var nf=document.getElementById('wishName');
      if(name&&nf&&!nf.value){nf.value=name;autoDetectCategory(name);}
    }
    function autoDetectCategory(name){
      var n=name.toLowerCase(),cat=null;
      if(/bar|cantina|pulque|mezcal|cervec|coctel|taberna|licor|tlecan|balmori|pub\b/i.test(n))cat='bar';
      else if(/museo|palacio|biblioteca|plaza|iglesia|catedral|monumento|arqueol|pirámide|galería|galeria/i.test(n))cat='culture';
      else if(/hotel|hostal|suites|andaz|marriott|hilton|hyatt|inn\b|lodge/i.test(n))cat='hotel';
      else if(/aeropuerto|airport|terminal|estaci[oó]n|metro\b/i.test(n))cat='transport';
      else if(/taquería|taqueria|taco|restauran|bistro|comedor|mariscos|fonda|mercado|cocina|café|cafe|coffee|bakery|panadería|torta|sushi|pizza|burger/i.test(n))cat='food';
      if(cat){var sel=document.getElementById('wishCategory');if(sel)sel.value=cat;}
    }
    function openWishAdd(){
      editingWishId=null;
      document.getElementById('wishModalTitle').textContent='위시리스트 추가';
      document.getElementById('wishMapsUrl').value='';document.getElementById('wishName').value='';
      document.getElementById('wishNotes').value='';document.getElementById('wishCategory').value='food';
      document.getElementById('wishDeleteBtn').style.display='none';document.getElementById('wishSaveBtn').textContent='추가';
      document.getElementById('wishModal').classList.add('open');
      setTimeout(function(){document.getElementById('wishMapsUrl').focus();},100);
    }
    function editWishItem(id){
      var w=WISHLIST.find(function(x){return x.id===id;});if(!w)return;
      editingWishId=id;
      document.getElementById('wishModalTitle').textContent='위시리스트 수정';
      document.getElementById('wishMapsUrl').value=w.mapsUrl||'';document.getElementById('wishName').value=w.name||'';
      document.getElementById('wishNotes').value=w.notes||'';document.getElementById('wishCategory').value=w.category||'food';
      document.getElementById('wishDeleteBtn').style.display='';document.getElementById('wishSaveBtn').textContent='저장';
      document.getElementById('wishModal').classList.add('open');
    }
    function closeWishModal(){document.getElementById('wishModal').classList.remove('open');editingWishId=null;}
    function saveWishItem(e){
      e.preventDefault();
      var url=document.getElementById('wishMapsUrl').value.trim(),name=document.getElementById('wishName').value.trim();
      var notes=document.getElementById('wishNotes').value.trim(),cat=document.getElementById('wishCategory').value;
      var lat=null,lng=null,cm=url.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);
      if(!cm)cm=url.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
      if(cm){lat=parseFloat(cm[1]);lng=parseFloat(cm[2]);}
      if(editingWishId){
        var w=WISHLIST.find(function(x){return x.id===editingWishId;});
        if(w){w.name=name;w.notes=notes;w.category=cat;w.mapsUrl=url;w.lat=lat||w.lat;w.lng=lng||w.lng;if(w.calEventId){var ev=getEv(w.calDayId,w.calEventId);if(ev){ev.title=name;ev.category=cat;ev.subtitle=notes;}}}
      } else {
        WISHLIST.push({id:'wl_'+genId(),name:name,notes:notes,category:cat,mapsUrl:url,lat:lat,lng:lng,visited:false,fromItinerary:false,dayLabel:'',calDayId:null,calEventId:null});
        wishStatusFilter='all';
      }
      closeWishModal();rerender();
    }
    function deleteWishItem(){
      if(!editingWishId)return;if(!confirm('위시리스트에서 삭제할까요?'))return;
      var w=WISHLIST.find(function(x){return x.id===editingWishId;});
      if(w&&w.calDayId&&w.calEventId){var day=DAYS.find(function(d){return d.id===w.calDayId;});if(day)day.events=day.events.filter(function(e){return e.id!==w.calEventId;});}
      WISHLIST=WISHLIST.filter(function(x){return x.id!==editingWishId;});closeWishModal();rerender();
    }

    // ==================== SCHEDULE MODAL ====================
    var schedWishId=null,schedDayId=null,schedStartMin=600,schedDurMin=60;
    var schedDragType=null,schedDragStartY=0,schedDragStartMin=0,schedDragStartDur=0;
    function openSchedModal(wishId){
      schedWishId=wishId;var w=WISHLIST.find(function(x){return x.id===wishId;});if(!w)return;
      if(w.calDayId&&w.calEventId){var ev=getEv(w.calDayId,w.calEventId);if(ev){schedDayId=w.calDayId;schedStartMin=toMin(ev.time);schedDurMin=ev.endTime?Math.max(15,toMin(ev.endTime)-schedStartMin):60;}else{w.calDayId=null;w.calEventId=null;w.visited=false;schedDayId=DAYS[0].id;schedStartMin=600;schedDurMin=60;}}
      else{schedDayId=DAYS[0].id;schedStartMin=600;schedDurMin=60;}
      renderSchedModal();document.getElementById('schedModal').classList.add('open');
    }
    function closeSchedModal(){document.getElementById('schedModal').classList.remove('open');document.removeEventListener('mousemove',onSchedDrag);document.removeEventListener('mouseup',onSchedDragEnd);schedDragType=null;}
    function renderSchedModal(){
      var w=WISHLIST.find(function(x){return x.id===schedWishId;});if(!w)return;
      var isEdit=!!(w.calDayId&&w.calEventId),hv=Math.floor(schedStartMin/60),mv=schedStartMin%60;
      var h='<div class="sched-header"><div><div class="sched-title">'+(isEdit?'📅 일정 수정':'📅 일정 추가')+'</div><div class="sched-item-name">'+w.name+'</div></div><button class="modal-close" onclick="closeSchedModal()">✕</button></div>';
      h+='<div class="sched-days">';
      DAYS.forEach(function(d){var ia=schedDayId===d.id;h+='<button class="sched-day-btn'+(ia?' active':'')+'" onclick="setSchedDay(\''+d.id+'\')"'+(ia?' style="background:'+d.color+';color:white;border-color:transparent"':'')+'>'+d.date+'<br><span style="font-size:0.62rem;opacity:0.8">'+d.theme.slice(0,8)+'</span></button>';});
      h+='</div><div class="sched-time-row"><div class="sched-time-group"><label>시작</label><div class="sched-time-inputs"><input type="number" id="schedHour" min="8" max="22" value="'+hv+'" oninput="onSchedTimeChange()"><span style="font-weight:700">:</span><select id="schedMin" onchange="onSchedTimeChange()">';
      [0,15,30,45].forEach(function(m){h+='<option value="'+m+'"'+(mv===m?' selected':'')+'>'+('0'+m).slice(-2)+'</option>';});
      h+='</select></div></div><div class="sched-time-group"><label>소요</label><select id="schedDur" onchange="onSchedDurChange()">';
      [[30,'30분'],[60,'1시간'],[90,'1.5시간'],[120,'2시간'],[180,'3시간'],[240,'4시간']].forEach(function(o){h+='<option value="'+o[0]+'"'+(schedDurMin===o[0]?' selected':'')+'>'+o[1]+'</option>';});
      h+='</select></div></div><div class="sched-cal" id="schedCal" style="min-height:200px;max-height:340px">'+renderSchedCalInner()+'</div>';
      h+='<div class="sched-footer">'+(isEdit?'<button class="sched-del-btn" onclick="removeFromCalendar()">⏰ 시간 제거</button>':'<span></span>');
      h+='<div class="sched-footer-right"><button class="sched-cancel-btn" onclick="closeSchedModal()">취소</button><button class="sched-save-btn" onclick="saveSchedule()">저장</button></div></div>';
      document.getElementById('schedModalInner').innerHTML=h;setTimeout(attachSchedCalEvents,0);
    }
    function renderSchedCalInner(){
      var PX=44,S=8,E=23,w=WISHLIST.find(function(x){return x.id===schedWishId;}),day=DAYS.find(function(d){return d.id===schedDayId;});if(!day)return'';
      var linked=w?w.calEventId:null,h='<div id="schedCalInner" style="position:relative;height:'+((E-S)*PX)+'px;padding:0 0 4px 0">';
      for(var hr=S;hr<E;hr++)h+='<div class="sched-cal-hr" style="top:'+((hr-S)*PX)+'px"><span class="sched-cal-hr-label">'+hr+':00</span></div>';
      sortEvs(day.events).forEach(function(ev){
        if(ev.id===linked)return;
        var sm=toMin(ev.time),em=ev.endTime?toMin(ev.endTime):sm+60;
        h+='<div class="sched-ev-block" style="top:'+((sm/60-S)*PX)+'px;height:'+Math.max(18,(em-sm)/60*PX)+'px;background:'+day.color+'25;border-left:3px solid '+day.color+'"><div style="font-size:0.68rem;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+ev.title+'</div><div style="font-size:0.6rem;opacity:0.7">'+fmtTime(ev.time)+(ev.endTime?' – '+fmtTime(ev.endTime):'')+'</div></div>';
      });
      var nt=(schedStartMin/60-S)*PX,nh=Math.max(20,schedDurMin/60*PX);
      h+='<div class="sched-new-block" id="schedNewBlock" style="top:'+nt+'px;height:'+nh+'px" onmousedown="startSchedDrag(event)"><div style="font-size:0.7rem;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+(w?w.name:'')+'</div><div style="font-size:0.62rem;opacity:0.9">'+minToStr(schedStartMin)+' – '+minToStr(schedStartMin+schedDurMin)+'</div><div class="sched-resize-handle" onmousedown="startSchedResize(event)">⠿</div></div></div>';
      return h;
    }
    function attachSchedCalEvents(){
      var inner=document.getElementById('schedCalInner');if(!inner)return;
      inner.addEventListener('click',function(e){
        if(e.target.closest('.sched-new-block')||e.target.closest('.sched-ev-block'))return;
        var rect=inner.getBoundingClientRect();
        schedStartMin=Math.max(8*60,Math.min(22*60,Math.round(((e.clientY-rect.top)/44+8)*60/15)*15));
        syncSchedInputs();refreshSchedCal();
      });
    }
    function startSchedDrag(e){e.preventDefault();schedDragType='move';schedDragStartY=e.clientY;schedDragStartMin=schedStartMin;document.addEventListener('mousemove',onSchedDrag);document.addEventListener('mouseup',onSchedDragEnd);}
    function startSchedResize(e){e.preventDefault();e.stopPropagation();schedDragType='resize';schedDragStartY=e.clientY;schedDragStartDur=schedDurMin;document.addEventListener('mousemove',onSchedDrag);document.addEventListener('mouseup',onSchedDragEnd);}
    function onSchedDrag(e){var dm=Math.round((e.clientY-schedDragStartY)/44*60/15)*15;if(schedDragType==='move')schedStartMin=Math.max(8*60,Math.min(22*60,schedDragStartMin+dm));else schedDurMin=Math.max(15,schedDragStartDur+dm);syncSchedInputs();refreshSchedCal();}
    function onSchedDragEnd(){schedDragType=null;document.removeEventListener('mousemove',onSchedDrag);document.removeEventListener('mouseup',onSchedDragEnd);}
    function syncSchedInputs(){var hi=document.getElementById('schedHour'),ms=document.getElementById('schedMin'),ds=document.getElementById('schedDur');if(hi)hi.value=Math.floor(schedStartMin/60);if(ms)ms.value=schedStartMin%60;if(ds){var durs=[30,60,90,120,180,240];schedDurMin=durs.reduce(function(p,c){return Math.abs(c-schedDurMin)<Math.abs(p-schedDurMin)?c:p;});ds.value=schedDurMin;}}
    function refreshSchedCal(){var cal=document.getElementById('schedCal');if(cal){cal.innerHTML=renderSchedCalInner();setTimeout(attachSchedCalEvents,0);}}
    function onSchedTimeChange(){var h=Math.max(8,Math.min(22,parseInt(document.getElementById('schedHour').value)||10)),m=parseInt(document.getElementById('schedMin').value)||0;schedStartMin=h*60+m;refreshSchedCal();}
    function onSchedDurChange(){schedDurMin=parseInt(document.getElementById('schedDur').value)||60;refreshSchedCal();}
    function setSchedDay(id){schedDayId=id;renderSchedModal();}
    function saveSchedule(){
      var w=WISHLIST.find(function(x){return x.id===schedWishId;});if(!w){closeSchedModal();return;}
      var day=DAYS.find(function(d){return d.id===schedDayId;});if(!day){closeSchedModal();return;}
      var s=minToStr(schedStartMin),e=minToStr(schedStartMin+schedDurMin);
      if(w.calEventId&&w.calDayId){
        var od=DAYS.find(function(d){return d.id===w.calDayId;}),ev=od?od.events.find(function(x){return x.id===w.calEventId;}):null;
        if(ev){if(w.calDayId!==schedDayId){od.events=od.events.filter(function(x){return x.id!==w.calEventId;});ev.id='wl_ev_'+genId();day.events.push(ev);w.calDayId=schedDayId;w.calEventId=ev.id;}ev.time=s;ev.endTime=e;}
      } else {
        var nid='wl_ev_'+genId();
        day.events.push({id:nid,title:w.name,subtitle:w.notes||'',category:w.category||'other',time:s,endTime:e,notes:'',optional:false,lat:w.lat||null,lng:w.lng||null});
        w.calDayId=schedDayId;w.calEventId=nid;w.visited=true;
      }
      w.dayLabel=day.date;closeSchedModal();rerender();
    }
    function removeFromCalendar(){
      var w=WISHLIST.find(function(x){return x.id===schedWishId;});
      if(w&&w.calDayId&&w.calEventId){var day=DAYS.find(function(d){return d.id===w.calDayId;});if(day)day.events=day.events.filter(function(e){return e.id!==w.calEventId;});w.calDayId=null;w.calEventId=null;w.visited=false;w.dayLabel='';}
      closeSchedModal();rerender();
    }

    // ==================== MENU ====================
    function toggleMenu(){document.getElementById('vizMenuDropdown').classList.toggle('open');}
    document.addEventListener('click',function(ev){
      if(!ev.target.closest('.viz-menu'))document.getElementById('vizMenuDropdown').classList.remove('open');
      if(ev.target===document.getElementById('editModal'))closeEditModal();
      if(ev.target===document.getElementById('wishModal'))closeWishModal();
    });
    document.addEventListener('keydown',function(ev){
      if(ev.key==='Escape'){document.getElementById('vizMenuDropdown').classList.remove('open');closeEditModal();closeWishModal();closeCalPickModal();closeSchedModal();}
    });

    // ==================== THEME ====================
    var savedTheme=localStorage.getItem('viz-theme');
    var currentTheme=savedTheme||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
    function applyTheme(t){
      document.documentElement.className='theme-'+t;
      document.getElementById('themeIcon').textContent=t==='dark'?'🌙':'☀️';
      document.getElementById('themeLabel').textContent=t==='dark'?'다크모드':'라이트모드';
      localStorage.setItem('viz-theme',t);currentTheme=t;
      if(leafletMap)setTiles(t==='dark');rerender();
    }
    function cycleTheme(){applyTheme(currentTheme==='dark'?'light':'dark');}
    async function downloadImage(){
      var menu=document.querySelector('.viz-menu');menu.style.display='none';
      try{var url=await htmlToImage.toPng(document.body,{quality:1,pixelRatio:2});var a=document.createElement('a');a.href=url;a.download='mexico-city-travel-plan.png';a.click();}catch(err){console.error(err);}
      menu.style.display='';
    }

    // ==================== INIT ====================
    document.addEventListener('DOMContentLoaded', async function() {
      applyTheme(currentTheme);
      try {
        await loadData();
      } catch(e) {
        console.error('Firebase load error:', e);
        // Fall back to seed data if Firestore is unreachable
        DAYS = JSON.parse(JSON.stringify(SEED_DAYS));
        WISHLIST = JSON.parse(JSON.stringify(SEED_WISHLIST));
      }
      document.getElementById('loadingScreen').style.display = 'none';
      renderCal();
    });
  </script>
</body>
</html>
