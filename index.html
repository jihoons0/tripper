    function closeEditModal(){document.getElementById('editModal').classList.remove('open');editingDayId=null;editingEvId=null;}
    function parseEditMapsUrl(url){
      url=(url||'').trim();if(!url)return;
      var mu=document.getElementById('editMapsUrl');
      if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(url)){
        fetch('/api/expand-url?url='+encodeURIComponent(url))
          .then(function(r){return r.json();})
          .then(function(d){
            if(d.lat!=null)mu.dataset.lat=d.lat;if(d.lng!=null)mu.dataset.lng=d.lng;
            var titleEl=document.getElementById('editTitle'),notesEl=document.getElementById('editNotes');
            var best=d.name||(d.address?d.address:'');
            if(best&&titleEl&&!titleEl.value)titleEl.value=best;
            if(d.name&&d.address&&notesEl&&!notesEl.value)notesEl.value=d.address;
          }).catch(function(){});
        return;
      }
      var cm=url.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/)||url.match(/[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/);
      if(cm){mu.dataset.lat=cm[1];mu.dataset.lng=cm[2];}
    }
    function saveEditEvent(e){
      e.preventDefault();
      var mu=document.getElementById('editMapsUrl');
      var isPlace = document.getElementById('editForm').classList.contains('mode-place');
      var fields={
        type: isPlace ? 'place' : 'event',
        time:document.getElementById('editTime').value,
        endTime:document.getElementById('editEndTime').value,
        title:document.getElementById('editTitle').value,
        subtitle:document.getElementById('editSubtitle').value,
        notes:document.getElementById('editNotes').value,
        category:document.getElementById('editCategory').value,
        optional:document.getElementById('editOptional').checked,
        mapsUrl:mu.value.trim(),
        lat:(mu.dataset.lat?parseFloat(mu.dataset.lat):null),
        lng:(mu.dataset.lng?parseFloat(mu.dataset.lng):null),
      };
      if(!editingEvId){
        // Create new event
        var day=getDay(editingDayId);if(!day)return;
        fields.id='ev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);
        day.events.push(fields);
      } else {
        // Update existing event
        var ev=getEv(editingDayId,editingEvId);if(!ev)return;
        Object.assign(ev,fields);
        if(!mu.value){ev.lat=null;ev.lng=null;}
        var w=WISHLIST.find(function(x){return x.calEventId===ev.id;});
        if(w){w.name=ev.title;w.category=ev.category;if(ev.lat!=null)w.lat=ev.lat;if(ev.lng!=null)w.lng=ev.lng;}
      }
      closeEditModal();rerender();
    }

      if(!editingDayId||!editingEvId)return;if(!confirm('이 일정을 삭제할까요?'))return;
      var day=getDay(editingDayId);if(!day)return;
      var w=WISHLIST.find(function(x){return x.calEventId===editingEvId;});
      if(w){w.calDayId=null;w.calEventId=null;w.visited=false;w.dayLabel='';}
      day.events=day.events.filter(function(e){return e.id!==editingEvId;});
      closeEditModal();rerender();
    }

    function removeTimeFromWish(wishId){

    function parseGmapsUrl(url){
      url=(url||'').trim();if(!url)return;
      if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(url)){
        var nf=document.getElementById('wishName');if(nf)nf.placeholder='불러오는 중…';
        fetch('/api/expand-url?url='+encodeURIComponent(url))
          .then(function(r){return r.json();})
          .then(function(d){
            var nf2=document.getElementById('wishName');if(nf2)nf2.placeholder='예: Contramar';
            applyGmapsInfo(d.url||url, d.name||'', d.address||'', d.lat||null, d.lng||null, d.category||'');
          })
          .catch(function(){var nf2=document.getElementById('wishName');if(nf2)nf2.placeholder='예: Contramar';});
        return;
      }
      applyGmapsInfo(url,'','',null,null,'');
    }
    function applyGmapsInfo(url, serverName, serverAddress, lat, lng, serverCategory){
      var name=serverName||'';
      // URL-based name fallbacks
      if(!name){
        var nm=url.match(/maps\/(?:place|search)\/([^/@?,&]+)/);
        if(nm)name=decodeURIComponent(nm[1]).replace(/\+/g,' ').replace(/_/g,' ').trim();
      }
      if(!name){var qm=url.match(/[?&](?:q|query)=([^&@,]+)/);if(qm)name=decodeURIComponent(qm[1]).replace(/\+/g,' ').trim();}
      // If still no name, fall back to address / district
      var displayName = name || serverAddress || '';
      var nf=document.getElementById('wishName');
      if(displayName&&nf&&!nf.value){
        nf.value=displayName;
        if(serverCategory) { var sel=document.getElementById('wishCategory');if(sel)sel.value=serverCategory; }
        else autoDetectCategory(displayName);
      }
      // If we got a business name AND an address, pre-fill the notes field with the address
      var notesEl=document.getElementById('wishNotes');
      if(name&&serverAddress&&notesEl&&!notesEl.value) notesEl.value=serverAddress;
      // Store parsed lat/lng on the input element for saveWishItem to pick up
      var wu=document.getElementById('wishMapsUrl');
      if(wu&&lat!=null&&lng!=null){wu.dataset.lat=lat;wu.dataset.lng=lng;}
    }
    function autoDetectCategory(name){
      var n=name.toLowerCase(),cat=null;
      if(/bar|cantina|pulque|mezcal|cervec|coctel|taberna|licor|tlecan|balmori|pub\b/i.test(n))cat='bar';
      else if(/museo|palacio|biblioteca|plaza|iglesia|catedral|monumento|arqueol|pirámide|galería|galeria/i.test(n))cat='culture';
      else if(/hotel|hostal|suites|andaz|marriott|hilton|hyatt|inn\b|lodge/i.test(n))cat='hotel';
      else if(/aeropuerto|airport|terminal|estaci[oó]n|metro\b/i.test(n))cat='transport';
      else if(/taquería|taqueria|taco|restauran|bistro|comedor|mariscos|fonda|mercado|cocina|café|cafe|coffee|bakery|panadería|torta|sushi|pizza|burger/i.test(n))cat='food';
      if(cat){var sel=document.getElementById('wishCategory');if(sel)sel.value=cat;}
    }

    function saveWishItem(e){
      e.preventDefault();
      var url=document.getElementById('wishMapsUrl').value.trim(),name=document.getElementById('wishName').value.trim()||url;

        WISHLIST.push(newW);

    // ==================== TIME PICKER SEGMENTS ====================
    function tpSetFromMin(min) {
      var h24 = Math.floor(min/60), m = min%60;
      var ampm = h24 >= 12 ? 'PM' : 'AM';
      var h12 = h24 % 12 || 12;
      document.getElementById('tpHour').textContent = h12;
      document.getElementById('tpMin').textContent = m < 10 ? '0'+m : ''+m;
      document.getElementById('tpAmpm').textContent = ampm;
    }
    function tpGetMin() {
      var h12 = parseInt(document.getElementById('tpHour').textContent);
      var m = parseInt(document.getElementById('tpMin').textContent);
      var ampm = document.getElementById('tpAmpm').textContent;
      var h24 = ampm === 'AM' ? (h12 === 12 ? 0 : h12) : (h12 === 12 ? 12 : h12 + 12);
      return h24*60 + m;
    }
    function tpCycle(part) {
      var h12 = parseInt(document.getElementById('tpHour').textContent);
      var m = parseInt(document.getElementById('tpMin').textContent);
      var ampm = document.getElementById('tpAmpm').textContent;
      if (part === 'hour') { h12 = (h12 % 12) + 1; document.getElementById('tpHour').textContent = h12; }
      if (part === 'min')  { m = (m + 30) % 60; document.getElementById('tpMin').textContent = m < 10 ? '0'+m : ''+m; }
      if (part === 'ampm') { ampm = ampm === 'AM' ? 'PM' : 'AM'; document.getElementById('tpAmpm').textContent = ampm; }
      calAddStartMin = tpGetMin();
      updateCalAddEndTime();
    }

    // ==================== CAL ADD MODAL ====================
    var CAL_ADD_DURS=[30,60,90,120,150,180,210,240];

    function durLabel(min){var h=Math.floor(min/60),m=min%60;if(h===0)return m+'분';if(m===0)return h+'시간';return h+'시간 '+m+'분';}

        w.calDayId=calAddDayId;w.calEventId=nid;w.visited=true;w.dayLabel=day.date;

    function deleteWishItem(){
      if(!editingWishId)return;if(!confirm('장소를 삭제할까요?'))return;
      var w=WISHLIST.find(function(x){return x.id===editingWishId;});
      if(w&&w.calDayId&&w.calEventId){var day=DAYS.find(function(d){return d.id===w.calDayId;});if(day)day.events=day.events.filter(function(e){return e.id!==w.calEventId;});}
      WISHLIST=WISHLIST.filter(function(x){return x.id!==editingWishId;});closeWishModal();rerender();
    }

    // ==================== SCHEDULE MODAL ====================
    var schedWishId=null,schedDayId=null,schedStartMin=600,schedDurMin=60;
    var schedDragType=null,schedDragStartY=0,schedDragStartMin=0,schedDragStartDur=0;
    function openSchedModal(wishId){
      schedWishId=wishId;var w=WISHLIST.find(function(x){return x.id===wishId;});if(!w)return;
      if(w.calDayId&&w.calEventId){var ev=getEv(w.calDayId,w.calEventId);if(ev){schedDayId=w.calDayId;schedStartMin=toMin(ev.time);schedDurMin=ev.endTime?Math.max(15,toMin(ev.endTime)-schedStartMin):60;}else{w.calDayId=null;w.calEventId=null;w.visited=false;schedDayId=DAYS[0].id;schedStartMin=600;schedDurMin=60;}}
      else{
        schedDayId=DAYS[0].id;
        // Use saved timeslot as default if present
        var defStart = w.placeStart||w.noteStart||null;
        var defEnd   = w.placeEnd||w.noteEnd||null;
        schedStartMin = defStart ? toMin(defStart) : 600;
        schedDurMin   = (defStart&&defEnd) ? Math.max(15,toMin(defEnd)-toMin(defStart)) : 60;
      }
      renderSchedModal();document.getElementById('schedModal').classList.add('open');
    }
    function closeSchedModal(){document.getElementById('schedModal').classList.remove('open');document.removeEventListener('mousemove',onSchedDrag);document.removeEventListener('mouseup',onSchedDragEnd);schedDragType=null;}
    function renderSchedModal(){
      var w=WISHLIST.find(function(x){return x.id===schedWishId;});if(!w)return;
      var isEdit=!!(w.calDayId&&w.calEventId),hv=Math.floor(schedStartMin/60),mv=schedStartMin%60;
      var h='<div class="sched-header"><div><div class="sched-title">'+(isEdit?'📅 일정 수정':'📅 일정 추가')+'</div><div class="sched-item-name">'+w.name+'</div></div><button class="modal-close" onclick="closeSchedModal()">✕</button></div>';
      h+='<div class="sched-days">';
      DAYS.forEach(function(d){var ia=schedDayId===d.id;h+='<button class="sched-day-btn'+(ia?' active':'')+'" onclick="setSchedDay(\''+d.id+'\')"'+(ia?' style="background:'+d.color+';color:white;border-color:transparent"':'')+'>'+d.date+'<br><span style="font-size:0.62rem;opacity:0.8">'+d.theme.slice(0,8)+'</span></button>';});
      h+='</div><div class="sched-time-row"><div class="sched-time-group"><label>시작</label><div class="sched-time-inputs"><input type="number" id="schedHour" min="8" max="22" value="'+hv+'" oninput="onSchedTimeChange()"><span style="font-weight:700">:</span><select id="schedMin" onchange="onSchedTimeChange()">';
      [0,15,30,45].forEach(function(m){h+='<option value="'+m+'"'+(mv===m?' selected':'')+'>'+('0'+m).slice(-2)+'</option>';});
      h+='</select></div></div><div class="sched-time-group"><label>소요</label><select id="schedDur" onchange="onSchedDurChange()">';
      [[30,'30분'],[60,'1시간'],[90,'1.5시간'],[120,'2시간'],[180,'3시간'],[240,'4시간']].forEach(function(o){h+='<option value="'+o[0]+'"'+(schedDurMin===o[0]?' selected':'')+'>'+o[1]+'</option>';});
      h+='</select></div></div><div class="sched-cal" id="schedCal" style="min-height:200px;max-height:340px">'+renderSchedCalInner()+'</div>';
      h+='<div class="sched-footer">'+(isEdit?'<button class="sched-del-btn" onclick="removeFromCalendar()">⏰ 시간 제거</button>':'<span></span>');
      h+='<div class="sched-footer-right"><button class="sched-cancel-btn" onclick="closeSchedModal()">취소</button><button class="sched-save-btn" onclick="saveSchedule()">저장</button></div></div>';
      document.getElementById('schedModalInner').innerHTML=h;setTimeout(attachSchedCalEvents,0);
    }
    function renderSchedCalInner(){
      var PX=44,S=8,E=23,w=WISHLIST.find(function(x){return x.id===schedWishId;}),day=DAYS.find(function(d){return d.id===schedDayId;});if(!day)return'';
      var linked=w?w.calEventId:null,h='<div id="schedCalInner" style="position:relative;height:'+((E-S)*PX)+'px;padding:0 0 4px 0">';
      for(var hr=S;hr<E;hr++)h+='<div class="sched-cal-hr" style="top:'+((hr-S)*PX)+'px"><span class="sched-cal-hr-label">'+hr+':00</span></div>';
      sortEvs(day.events).forEach(function(ev){
        if(ev.id===linked)return;
        var sm=toMin(ev.time),em=ev.endTime?toMin(ev.endTime):sm+60;
        h+='<div class="sched-ev-block" style="top:'+((sm/60-S)*PX)+'px;height:'+Math.max(18,(em-sm)/60*PX)+'px;background:'+day.color+'25;border-left:3px solid '+day.color+'"><div style="font-size:0.68rem;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+ev.title+'</div><div style="font-size:0.6rem;opacity:0.7">'+fmtTime(ev.time)+(ev.endTime?' – '+fmtTime(ev.endTime):'')+'</div></div>';
      });
      var nt=(schedStartMin/60-S)*PX,nh=Math.max(20,schedDurMin/60*PX);
      h+='<div class="sched-new-block" id="schedNewBlock" style="top:'+nt+'px;height:'+nh+'px" onmousedown="startSchedDrag(event)"><div style="font-size:0.7rem;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+(w?w.name:'')+'</div><div style="font-size:0.62rem;opacity:0.9">'+minToStr(schedStartMin)+' – '+minToStr(schedStartMin+schedDurMin)+'</div><div class="sched-resize-handle" onmousedown="startSchedResize(event)">⠿</div></div></div>';
      return h;
    }
    function attachSchedCalEvents(){
      var inner=document.getElementById('schedCalInner');if(!inner)return;
      inner.addEventListener('click',function(e){
        if(e.target.closest('.sched-new-block')||e.target.closest('.sched-ev-block'))return;
        var rect=inner.getBoundingClientRect();
        schedStartMin=Math.max(8*60,Math.min(22*60,Math.round(((e.clientY-rect.top)/44+8)*60/15)*15));
        syncSchedInputs();refreshSchedCal();
      });
    }
    function startSchedDrag(e){e.preventDefault();schedDragType='move';schedDragStartY=e.clientY;schedDragStartMin=schedStartMin;document.addEventListener('mousemove',onSchedDrag);document.addEventListener('mouseup',onSchedDragEnd);}
    function startSchedResize(e){e.preventDefault();e.stopPropagation();schedDragType='resize';schedDragStartY=e.clientY;schedDragStartDur=schedDurMin;document.addEventListener('mousemove',onSchedDrag);document.addEventListener('mouseup',onSchedDragEnd);}
    function onSchedDrag(e){var dm=Math.round((e.clientY-schedDragStartY)/44*60/15)*15;if(schedDragType==='move')schedStartMin=Math.max(8*60,Math.min(22*60,schedDragStartMin+dm));else schedDurMin=Math.max(15,schedDragStartDur+dm);syncSchedInputs();refreshSchedCal();}
    function onSchedDragEnd(){schedDragType=null;document.removeEventListener('mousemove',onSchedDrag);document.removeEventListener('mouseup',onSchedDragEnd);}
    function syncSchedInputs(){var hi=document.getElementById('schedHour'),ms=document.getElementById('schedMin'),ds=document.getElementById('schedDur');if(hi)hi.value=Math.floor(schedStartMin/60);if(ms)ms.value=schedStartMin%60;if(ds){var durs=[30,60,90,120,180,240];schedDurMin=durs.reduce(function(p,c){return Math.abs(c-schedDurMin)<Math.abs(p-schedDurMin)?c:p;});ds.value=schedDurMin;}}
    function refreshSchedCal(){var cal=document.getElementById('schedCal');if(cal){cal.innerHTML=renderSchedCalInner();setTimeout(attachSchedCalEvents,0);}}
    function onSchedTimeChange(){var h=Math.max(8,Math.min(22,parseInt(document.getElementById('schedHour').value)||10)),m=parseInt(document.getElementById('schedMin').value)||0;schedStartMin=h*60+m;refreshSchedCal();}
    function onSchedDurChange(){schedDurMin=parseInt(document.getElementById('schedDur').value)||60;refreshSchedCal();}
    function setSchedDay(id){schedDayId=id;renderSchedModal();}
    function saveSchedule(){
      var w=WISHLIST.find(function(x){return x.id===schedWishId;});if(!w){closeSchedModal();return;}
      var day=DAYS.find(function(d){return d.id===schedDayId;});if(!day){closeSchedModal();return;}
      var s=minToStr(schedStartMin),e=minToStr(schedStartMin+schedDurMin);
      if(w.calEventId&&w.calDayId){
        var od=DAYS.find(function(d){return d.id===w.calDayId;}),ev=od?od.events.find(function(x){return x.id===w.calEventId;}):null;
        if(ev){if(w.calDayId!==schedDayId){od.events=od.events.filter(function(x){return x.id!==w.calEventId;});ev.id='wl_ev_'+genId();day.events.push(ev);w.calDayId=schedDayId;w.calEventId=ev.id;}ev.time=s;ev.endTime=e;}
      } else {
        var nid='wl_ev_'+genId();
        day.events.push({id:nid,title:w.name,subtitle:w.notes||'',category:w.category||'other',time:s,endTime:e,notes:'',optional:false,mapsUrl:w.mapsUrl||'',lat:w.lat||null,lng:w.lng||null});
        w.calDayId=schedDayId;w.calEventId=nid;w.visited=true;
      }
      w.dayLabel=day.date;closeSchedModal();rerender();
      // If no coordinates yet, geocode in background using place name + trip city
      if(!w.lat&&w.name) geocodeWishItem(w);
    }

    async function geocodeWishItem(w) {
      var city = currentTripMeta&&currentTripMeta.city ? currentTripMeta.city : '';
      var query = w.name + (city ? ', '+city : '');
      try {
        var r = await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(query)+'&format=json&limit=1&addressdetails=0');
        var data = await r.json();
        if (!data||!data[0]) return;
        var lat=parseFloat(data[0].lat), lng=parseFloat(data[0].lon);
        w.lat=lat; w.lng=lng;
        // Propagate to calendar event
        if(w.calEventId&&w.calDayId){var ev=getEv(w.calDayId,w.calEventId);if(ev){ev.lat=lat;ev.lng=lng;}}
        scheduleSave();
        if(currentView==='map'&&leafletMap) rebuildMarkers();
      } catch(e){}
    }
    function removeFromCalendar(){
      var w=WISHLIST.find(function(x){return x.id===schedWishId;});
      if(w&&w.calDayId&&w.calEventId){var day=DAYS.find(function(d){return d.id===w.calDayId;});if(day)day.events=day.events.filter(function(e){return e.id!==w.calEventId;});w.calDayId=null;w.calEventId=null;w.visited=false;w.dayLabel='';}
      closeSchedModal();rerender();
    }

    // ==================== CURRENCY CONVERTER ====================
    // country code → [currency code, flag emoji]
    var CC_TO_CURR = {
      MX:'MXN',GT:'GTQ',CR:'CRC',PA:'PAB',CO:'COP',PE:'PEN',CL:'CLP',AR:'ARS',BR:'BRL',
      US:'USD',CA:'CAD',GB:'GBP',IE:'EUR',FR:'EUR',DE:'EUR',IT:'EUR',ES:'EUR',PT:'EUR',
      NL:'EUR',BE:'EUR',AT:'EUR',GR:'EUR',FI:'EUR',NO:'NOK',SE:'SEK',DK:'DKK',CH:'CHF',
      JP:'JPY',KR:'KRW',CN:'CNY',HK:'HKD',TW:'TWD',SG:'SGD',TH:'THB',VN:'VND',
      ID:'IDR',MY:'MYR',PH:'PHP',IN:'INR',PK:'PKR',AE:'AED',SA:'SAR',TR:'TRY',
      EG:'EGP',ZA:'ZAR',AU:'AUD',NZ:'NZD',IL:'ILS',MA:'MAD'
    };
    function currCodeForTrip() {
      if (!currentTripMeta) return 'USD';
      var cc = (currentTripMeta.cityCountryCode || '').toUpperCase();
      return CC_TO_CURR[cc] || 'USD';
    }
    function currFlagForCode(code) {
      var map = {MXN:'🇲🇽',KRW:'🇰🇷',JPY:'🇯🇵',CNY:'🇨🇳',GBP:'🇬🇧',EUR:'🇪🇺',CAD:'🇨🇦',
        AUD:'🇦🇺',SGD:'🇸🇬',THB:'🇹🇭',INR:'🇮🇳',BRL:'🇧🇷',HKD:'🇭🇰',TWD:'🇹🇼',
        VND:'🇻🇳',IDR:'🇮🇩',MYR:'🇲🇾',PHP:'🇵🇭',CHF:'🇨🇭',SEK:'🇸🇪',NOK:'🇳🇴',
        DKK:'🇩🇰',AED:'🇦🇪',SAR:'🇸🇦',TRY:'🇹🇷',ZAR:'🇿🇦',NZD:'🇳🇿',ILS:'🇮🇱',
        USD:'🇺🇸',CLP:'🇨🇱',COP:'🇨🇴',ARS:'🇦🇷',PEN:'🇵🇪'};
      return (map[code]||'💱')+' '+code;
    }
    var currRate = null, currLocalCode = 'USD';
    async function loadCurrRates(){
      currLocalCode = currCodeForTrip();
      document.getElementById('currLocalLabel').textContent = currFlagForCode(currLocalCode);
      if (currLocalCode === 'USD') {
        currRate = 1;
        currConvert('local');
        document.getElementById('currRateInfo').textContent = '1 USD = 1 USD';
        return;
      }
      try{
        var r=await fetch('https://api.frankfurter.app/latest?from='+currLocalCode+'&to=USD');
        var d=await r.json();
        currRate=d.rates.USD;
        currConvert('local');
        document.getElementById('currRateInfo').textContent='1 '+currLocalCode+' = '+currRate.toFixed(4)+' USD · '+d.date;
      }catch(e){
        currRate=null;
        document.getElementById('currRateInfo').textContent='환율을 불러올 수 없습니다';
      }
    }
    function currConvert(from){
      if(!currRate)return;
      var localEl=document.getElementById('currLocal'),usdEl=document.getElementById('currUSD');
      if(!localEl||!usdEl)return;
      if(from==='local'){var v=parseFloat(localEl.value)||0;usdEl.value=+(v*currRate).toFixed(2);}
      else{var v=parseFloat(usdEl.value)||0;localEl.value=+(v/currRate).toFixed(2);}
    }
    function openCurrConverter(){
      document.getElementById('vizMenuDropdown').classList.remove('open');
      document.getElementById('currModal').classList.add('open');
      currRate=null; loadCurrRates();
      setTimeout(function(){var el=document.getElementById('currLocal');if(el){el.focus();el.select();}},100);
    }
    function closeCurrConverter(){document.getElementById('currModal').classList.remove('open');}
    function refreshCurrRates(){currRate=null;document.getElementById('currRateInfo').textContent='환율 불러오는 중…';loadCurrRates();}

    // ==================== MENU ====================
    function toggleMenu(){document.getElementById('vizMenuDropdown').classList.toggle('open');}
    document.addEventListener('click',function(ev){
      if(!ev.target.closest('.viz-menu'))document.getElementById('vizMenuDropdown').classList.remove('open');
      if(ev.target===document.getElementById('editModal'))closeEditModal();
      if(ev.target===document.getElementById('wishModal'))closeWishModal();
    });
    document.addEventListener('keydown',function(ev){
      if(ev.key==='Escape'){document.getElementById('vizMenuDropdown').classList.remove('open');closeEditModal();closeWishModal();closeCalPickModal();closeSchedModal();closeCurrConverter();closeTripCreate();}
    });

    // ==================== COBE GLOBE ====================
    var cobeGlobe = null, cobeRafId = null, cobeCachedTrips = [];
    var COBE_THETA = 0.2;
    function destroyCobe() {
      if (cobeRafId) { cancelAnimationFrame(cobeRafId); cobeRafId = null; }
      if (cobeGlobe) { try { cobeGlobe.destroy(); } catch(e) {} cobeGlobe = null; }
      var ov = document.getElementById('globeOverlay'); if (ov) ov.innerHTML = '';
    }
    // Project lat/lng → canvas x,y using cobe's exact coordinate convention
    // Matches cobe's latLonTo3D + rotation matrix from shuding/cobe source
    function projectGlobe(lat, lng, phi, theta, size) {
      var latR = lat * Math.PI / 180;
      var lonR = lng * Math.PI / 180 - Math.PI; // cobe applies -π offset to longitude
      var cosLat = Math.cos(latR);
      // cobe's latLonTo3D: [-cosLat*cos(lonR), sin(lat), cosLat*sin(lonR)]
      var px = -cosLat * Math.cos(lonR);
      var py = Math.sin(latR);
      var pz = cosLat * Math.sin(lonR);
      // cobe's rotation matrix: rotate(theta, phi)
      var cx = Math.cos(theta), cy = Math.cos(phi);
      var sx = Math.sin(theta), sy = Math.sin(phi);
      var rx = cy * px + sy * pz;
      var ry = sy * sx * px + cx * py - cy * sx * pz;
      var rz = -sy * cx * px + sx * py + cy * cx * pz;
      if (rz < 0) return null; // behind the globe
      // cobe screen coords: x=(rx+1)/2, y=(1-ry)/2 (both in [0,1])
      return { x: (rx + 1) / 2 * size, y: (1 - ry) / 2 * size, z: rz };
    }
    async function getPinCount(trip) {
      try {
        var cached = lsLoadTripData(trip.id);
        if (cached && cached.days) {
          return cached.days.reduce(function(n,d){ return n+(d.events||[]).filter(function(e){return e.lat&&e.lng;}).length; },0);
        }
        var snap = await Promise.race([
          db.collection('trips').doc(trip.id).collection('data').doc('main').get(),
          new Promise(function(_,rej){ setTimeout(function(){rej(new Error('timeout'));},3000); })
        ]);
        if (snap && snap.exists) {
          return (snap.data().days||[]).reduce(function(n,d){ return n+(d.events||[]).filter(function(e){return e.lat&&e.lng;}).length; },0);
        }
      } catch(e) {}
      return 0;
    }
    async function initCobe(trips) {
      cobeCachedTrips = trips;
      destroyCobe();
      var canvas = document.getElementById('cobeCanvas');
      if (!canvas) return;
      var s = canvas.offsetWidth;
      if (!s) return;

      var mappable = trips.filter(function(t){ return t.cityLat && t.cityLng; });
      var counts = await Promise.all(mappable.map(getPinCount));
      var pinMap = {};
      mappable.forEach(function(t,i){ pinMap[t.id] = counts[i]; });

      // Legend chips
      var legend = document.getElementById('globeLegend');
      if (legend) {
        legend.innerHTML = mappable.map(function(t) {
          var col = t.coverColor || '#f97316';
          var n = pinMap[t.id] || 0;
          return '<div class="globe-chip">'+
            '<span class="globe-chip-dot" style="background:'+col+'"></span>'+
            '<span class="globe-chip-city">'+(t.emoji ? t.emoji+' ' : '')+(t.city||t.name)+'</span>'+
            '<span class="globe-chip-count">'+n+'</span>'+
          '</div>';
        }).join('');
      }

      // Build flag overlay elements (one per trip)
      var overlay = document.getElementById('globeOverlay');
      var flagEls = [];
      if (overlay) {
        overlay.innerHTML = '';
        mappable.forEach(function(t) {
          var el = document.createElement('div');
          el.className = 'globe-flag';
          el.textContent = t.emoji || '📍';
          el.dataset.id = t.id;
          overlay.appendChild(el);
          flagEls.push(el);
        });
      }

      var startPhi = mappable.length ? (-Math.PI / 2 - parseFloat(mappable[0].cityLng) * Math.PI / 180) : 0;
      var dark = currentTheme === 'dark';

      import('https://esm.sh/cobe').then(function(mod) {
        var createGlobe = mod.default;
        cobeGlobe = createGlobe(canvas, {
          devicePixelRatio: 2,
          width: s * 2,
          height: s * 2,
          phi: startPhi,
          theta: COBE_THETA,
          dark: dark ? 1 : 0,
          diffuse: 1.2,
          mapSamples: 16000,
          mapBrightness: dark ? 2 : 6,
          baseColor: dark ? [0.1, 0.1, 0.2] : [1, 1, 1],
          markerColor: [0, 0, 0],
          glowColor: dark ? [0.1, 0.1, 0.3] : [1, 1, 1],
          markers: mappable.map(function(t){ return { location:[parseFloat(t.cityLat),parseFloat(t.cityLng)], size:0.01, id:t.id }; }),
        });

        var phi = startPhi;
        var isDragging = false, lastX = 0;
        canvas.addEventListener('pointerdown', function(e){ isDragging = true; lastX = e.clientX; canvas.style.cursor='grabbing'; });
        canvas.addEventListener('pointerup',   function(){ isDragging = false; canvas.style.cursor='grab'; });
        canvas.addEventListener('pointermove', function(e){ if(isDragging){ phi += (e.clientX-lastX)/200; lastX=e.clientX; } });

        function animate() {
          cobeRafId = requestAnimationFrame(animate);
          if (!isDragging) phi += 0.005;
          cobeGlobe.update({ phi: phi });
          // Position flag emoji via JS sphere projection
          mappable.forEach(function(t, i) {
            var el = flagEls[i]; if (!el) return;
            var pos = projectGlobe(parseFloat(t.cityLat), parseFloat(t.cityLng), phi, COBE_THETA, s);
            if (pos && pos.z > 0.05) {
              el.style.left = pos.x + 'px';
              el.style.top  = pos.y + 'px';
              el.style.opacity = String(Math.min(1, (pos.z - 0.05) / 0.2));
              el.style.display = 'block';
            } else {
              el.style.display = 'none';
            }
          });
        }
        animate();
      }).catch(function(){});
    }

    // ==================== THEME ====================
    var savedTheme=localStorage.getItem('viz-theme');
    var currentTheme=savedTheme||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
    function applyTheme(t){
      document.documentElement.className='theme-'+t;
      document.getElementById('themeIcon').textContent=t==='dark'?'🌙':'☀️';
      document.getElementById('themeLabel').textContent=t==='dark'?'다크모드':'라이트모드';
      localStorage.setItem('viz-theme',t);currentTheme=t;
      if(leafletMap)setTiles(t==='dark');rerender();
      var dashVisible = document.getElementById('view-dashboard') && document.getElementById('view-dashboard').style.display !== 'none';
      if(dashVisible){ setTimeout(function(){ initCobe(cobeCachedTrips); }, 50); }
    }
    function cycleTheme(){applyTheme(currentTheme==='dark'?'light':'dark');}
    async function downloadImage(){
      if(!currentTripId)return;
      var menu=document.querySelector('.viz-menu');menu.style.display='none';
      var fname=(currentTripMeta?currentTripMeta.name.replace(/\s/g,'-'):'travel')+'-plan.png';
      try{var url=await htmlToImage.toPng(document.body,{quality:1,pixelRatio:2});var a=document.createElement('a');a.href=url;a.download=fname;a.click();}catch(err){console.error(err);}
      menu.style.display='';
    }

    // ==================== INIT ====================
    document.addEventListener('DOMContentLoaded', async function() {
      applyTheme(currentTheme);
      await migrateIfNeeded(); // one-time migration; fast no-op after first run
      document.getElementById('calScrollOuter').addEventListener('scroll', function() {
        var hs = document.getElementById('calHeaderScroll');
        if (hs) hs.scrollLeft = this.scrollLeft;
      });
      setInterval(renderCalNowLine, 60000);
      initRouter();
    });
  </script>
